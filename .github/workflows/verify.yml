name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_FITCOACH_API_URL: https://api.example.com
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          FITCOACH_PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
  backend-and-real-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitcoach_test
          POSTGRES_PASSWORD: fitcoach-test-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fitcoach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITCOACH_TEST_ADMIN_URL: postgresql+psycopg://postgres:fitcoach-test-only@127.0.0.1:55432/fitcoach_test
      FITCOACH_TEST_DATABASE_URL: postgresql+psycopg://fitcoach_api:fitcoach-runtime-test-only@127.0.0.1:55432/fitcoach_test
      FITCOACH_TEST_ALLOW_RESET: 'YES'
      FITCOACH_REQUIRE_DATABASE_TESTS: '1'
      FITCOACH_PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt -r services/chatgpt_vm/requirements.txt
      - name: Provision disposable runtime role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:fitcoach-test-only@127.0.0.1:55432/fitcoach_test', autocommit=True) as connection:
              connection.execute("CREATE ROLE fitcoach_api LOGIN PASSWORD 'fitcoach-runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - run: python -m pytest backend/tests -q
      - run: python -m pytest services/chatgpt_vm -q
      - run: python -m pytest evaluations -q
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:real-api
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: real-api-failures
          path: frontend/test-results-real
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run benchmark
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-benchmark
          path: frontend/benchmark-results
